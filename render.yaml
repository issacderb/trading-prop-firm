services:
  - type: worker
    name: prop-firm-quant-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -u main.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SYMBOL
        value: BTCUSDT
      - key: INTERVAL
        value: 5m
      - key: RISK_PER_TRADE_PCT
        value: "0.005"
