services:
  # UNIFIED MASTER SERVICE: Chạy song song cả 3 Hệ thống (Crypto + Value Moat + Last Smoke) trên 1 Web Service duy nhất (Free 100%)
  - type: web
    name: trading-prop-firm
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -u main.py
    envVars:
      # 1. BOT CRYPTO PROP FIRM (Binance Futures BTCUSDT 5m)
      - key: TELEGRAM_BOT_TOKEN
        value: "8759863642:AAHkemnfZf44nzDdj5WTa_Ll6m4zcMJaFnc"
      - key: TELEGRAM_CHAT_ID
        value: "7189062506"
      - key: SYMBOL
        value: BTCUSDT
      - key: INTERVAL
        value: 5m
      - key: RISK_PER_TRADE_PCT
        value: "0.005"

      # 2. BOT WARREN BUFFETT VALUE / QUALITY MOAT (@Warrenbvaluebot)
      - key: VALUE_TELEGRAM_BOT_TOKEN
        value: "8786802235:AAEGZ03axxEsPuY4_hcIVp-3HVmtVhp0RVw"
      - key: VALUE_TELEGRAM_CHAT_ID
        value: "7189062506"

      # 3. BOT LAST SMOKE / CIGAR BUTT NET-NET (@Lastsmokewbbot)
      - key: CIGAR_TELEGRAM_BOT_TOKEN
        value: "8897938954:AAHg5IcxV_L-C0jHm82TWnue2zrlW47qdqk"
      - key: CIGAR_TELEGRAM_CHAT_ID
        value: "7189062506"

      # Cấu hình Vốn & Két tiền mặt 5%
      - key: INITIAL_CAPITAL
        value: "1000000000"
      - key: VAULT_ANNUAL_RATE
        value: "0.05"
      - key: PORT
        value: "10000"
